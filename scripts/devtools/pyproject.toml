[project]
name = "just-dev"
version = "0.1.0"
description = "Portable, least-privilege developer workflows for just"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "atlassian-python-api>=3.41,<6",
  "platformdirs>=4.2,<5",
  "pydantic>=2.7,<3",
  "pykeepass>=4.1,<5",
  "python-jenkins>=1.8,<2",
  "typer>=0.12,<1",
]

[project.scripts]
just-dev = "just_dev.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/just_dev"]

[dependency-groups]
dev = [
  "lefthook>=2.1,<3",
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.0,<8",
  "pytest-mock>=3.14,<4",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["just_dev"]

[tool.coverage.report]
fail_under = 67.51
precision = 2
show_missing = true

[tool.mypy]
files = ["src"]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
