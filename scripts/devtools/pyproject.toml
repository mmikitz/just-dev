[project]
name = "just-dev"
version = "0.1.0"
description = "Portable, least-privilege developer workflows for just"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "atlassian-python-api>=3.41,<4",
  "platformdirs>=4.2,<5",
  "pydantic>=2.7,<3",
  "pykeepass>=4.1,<5",
  "python-jenkins>=1.8,<2",
  "typer>=0.12,<1",
]

[project.scripts]
just-dev = "just_dev.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/just_dev"]

[dependency-groups]
dev = [
  "pytest>=8.2,<9",
  "pytest-mock>=3.14,<4",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
